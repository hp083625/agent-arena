name: Agent Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-agents:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check . --select=E,W,F

    - name: Test imports (dry run)
      env:
        GEMINI_API_KEY: test-key
      run: |
        python -c "import importlib.util; [(__import__('importlib.util').util.module_from_spec(spec:=__import__('importlib.util').util.spec_from_file_location(n,f)),spec.loader.exec_module(__import__('importlib.util').util.module_from_spec(spec))) and print(f'✅ {n} imports OK') for n,f in [('enhanced','arena_agent_enhanced.py'),('langchain','arena_agent_langchain.py'),('lightweight','arena_agent_lightweight.py')]]"

    - name: Check code formatting
      run: |
        pip install black
        black --check . || echo "Run black . to fix formatting"
